name: "GitHub Issues Translator"

on:
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created

jobs:
  add-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Translate issue to English
        uses: usthe/issues-translate-action@v2.8
        with:
          BOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_MODIFY_TITLE: false
